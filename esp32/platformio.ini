; Firmware ESP32 di Plekto, la piegafilo per retainer (scheda HW-656A: ESP32-WROOM-32 + LCD 1,9" ST7789 170x320)
; Compilare:  pio run            Caricare via USB:  pio run -e hw656a -t upload    Via Wi-Fi:  pio run -e hw656a_ota -t upload
[platformio]
extra_configs = segreti.ini

[env:hw656a]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; due slot OTA da ~1,9 MB con rollback (aggiornamenti dal Raspberry o via Wi-Fi)
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.2.1\"
    -DOTA_PASSWORD=\"${segreti.ota_pass}\"
    -DAGG_URL=\"https://github.com/pieroantonio/plekto-firmware/releases/latest/download/manifest.json\"
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    adafruit/Adafruit MCP23017 Arduino Library@2.3.2
    bblanchon/ArduinoJson@7.2.1

; aggiornamento via Wi-Fi: la scheda deve essere collegata alla rete (indirizzo mostrato in Informazioni)
[env:hw656a_ota]
extends = env:hw656a
upload_protocol = espota
upload_port = plekto.local
upload_flags =
    --auth=${segreti.ota_pass}
    --host_port=3233
; la scheda si ricollega al PC sulla porta 3233: serve una regola del firewall di Windows (rete privata)
